<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Asif Bhuiyan — portfolio.">
<title>ASIF BHUIYAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #e8e8e8;
    --muted: #5a7a5a;
    --green: #2dff6a;
    --green-dim: rgba(45, 255, 106, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: "Share Tech Mono", ui-monospace, Consolas, monospace; color: var(--ink);
  }
  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: crosshair; touch-action: none; background: #000;
  }

  .hud { position: fixed; z-index: 4; pointer-events: none; }
  .hud a { pointer-events: auto; color: var(--green); text-decoration: none; }
  .hud a:hover { color: var(--ink); }

  /* Ghost in the Shell–style title block */
  .brand-hud {
    top: clamp(1.1rem, 3.5vw, 2.2rem);
    left: clamp(1.1rem, 3.5vw, 2.4rem);
    max-width: min(34rem, 72vw);
  }
  .brand-hud .jp {
    margin: 0 0 0.35rem;
    font-size: clamp(0.65rem, 1.4vw, 0.78rem);
    letter-spacing: 0.22em;
    color: var(--green);
  }
  .brand-hud h1 {
    margin: 0;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 9vw, 5.6rem);
    letter-spacing: 0.14em;
    line-height: 0.88;
    color: var(--ink);
    text-shadow:
      0 0 1px rgba(255,255,255,0.4),
      2px 0 0 rgba(45,255,106,0.15),
      -1px 0 0 rgba(180,180,180,0.2);
  }
  .brand-hud .rule {
    display: block;
    width: min(100%, 18rem);
    height: 1px;
    margin: 0.55rem 0 0.45rem;
    background: linear-gradient(90deg, var(--green), transparent);
  }
  .brand-hud .links {
    margin: 0;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    display: flex;
    gap: 1.15rem;
    text-transform: uppercase;
  }
  .brand-hud .links a::before { content: "> "; color: var(--green); }

  /* Corner brackets + HUD chrome */
  .corner {
    position: fixed;
    z-index: 3;
    width: 28px;
    height: 28px;
    border: 1px solid var(--green-dim);
    pointer-events: none;
  }
  .corner.tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

  .hud-tr {
    top: clamp(1rem, 3vw, 1.8rem);
    right: clamp(1rem, 3vw, 2rem);
    text-align: right;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    color: var(--muted);
    line-height: 1.55;
  }
  .hud-tr .live { color: var(--green); }
  .hud-tr .live::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 0.45rem;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }

  .hud-br {
    right: clamp(1rem, 3vw, 2rem);
    bottom: clamp(2.6rem, 5vw, 3.4rem);
    text-align: right;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    line-height: 1.5;
  }
  .hud-br .cache {
    color: var(--green);
    opacity: 0.7;
  }
  .hud-br .cache.is-done { display: none; }

  .reticle {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    margin: -24px 0 0 -24px;
    z-index: 3;
    pointer-events: none;
    opacity: 0.28;
  }
  .reticle::before,
  .reticle::after {
    content: "";
    position: absolute;
    background: var(--green);
  }
  .reticle::before { left: 50%; top: 0; bottom: 0; width: 1px; margin-left: -0.5px; }
  .reticle::after { top: 50%; left: 0; right: 0; height: 1px; margin-top: -0.5px; }
  .reticle span {
    position: absolute;
    width: 8px;
    height: 8px;
    border: 1px solid var(--green);
  }
  .reticle span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .reticle span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .reticle span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .reticle span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  .scanline {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 2px,
      rgba(0, 0, 0, 0.12) 2px 3px
    );
    opacity: 0.35;
    mix-blend-mode: multiply;
  }

  .credit {
    position: fixed;
    left: 50%;
    bottom: clamp(0.85rem, 2.5vw, 1.35rem);
    transform: translateX(-50%);
    z-index: 4;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .credit a {
    color: var(--green);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .credit a:hover { border-bottom-color: var(--green-dim); color: var(--ink); }

  /* Terminal: published GitHub Pages endpoints */
  .term {
    position: fixed;
    z-index: 6;
    left: clamp(0.75rem, 2vw, 1.25rem);
    bottom: clamp(2.4rem, 5vw, 3.2rem);
    width: min(22rem, calc(100vw - 1.5rem));
    max-height: min(40vh, 22rem);
    display: flex;
    flex-direction: column;
    background: rgba(0, 8, 4, 0.88);
    border: 1px solid var(--green-dim);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 24px rgba(45, 255, 106, 0.08);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    transition: width 0.28s ease, opacity 0.28s ease, border-color 0.28s ease;
    pointer-events: auto;
  }
  .term-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.55rem;
    border-bottom: 1px solid var(--green-dim);
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    cursor: default;
    user-select: none;
  }
  .term-head .title { flex: 1; }
  .term-head button {
    appearance: none;
    border: 1px solid var(--green-dim);
    background: transparent;
    color: var(--green);
    font: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    padding: 0.15rem 0.4rem;
    cursor: pointer;
  }
  .term-head button:hover { background: rgba(45, 255, 106, 0.12); color: var(--ink); }
  .term-head .term-close {
    font-size: 0.95rem;
    line-height: 1;
    padding: 0.05rem 0.35rem 0.15rem;
  }
  .term-more {
    margin: 0.65rem 0 0;
    padding-top: 0.45rem;
    border-top: 1px solid rgba(45, 255, 106, 0.12);
    font-size: 0.68rem;
  }
  .term-more a {
    color: var(--green);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .term-more a:hover { color: var(--ink); }
  .term-body {
    overflow: auto;
    padding: 0.55rem 0.65rem 0.7rem;
    min-height: 4rem;
    scrollbar-width: thin;
    scrollbar-color: var(--green-dim) transparent;
  }
  .term-body::-webkit-scrollbar {
    width: 4px;
  }
  .term-body::-webkit-scrollbar-track {
    background: transparent;
  }
  .term-body::-webkit-scrollbar-thumb {
    background: var(--green-dim);
    border-radius: 0;
  }
  .term-body::-webkit-scrollbar-thumb:hover {
    background: var(--green);
  }
  .term-status {
    margin: 0 0 0.45rem;
    color: var(--muted);
    font-size: 0.68rem;
  }
  .term-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .term-list li {
    margin: 0 0 0.55rem;
    padding: 0 0 0.45rem;
    border-bottom: 1px solid rgba(45, 255, 106, 0.12);
  }
  .term-list li:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .term-list .name {
    display: block;
    color: var(--ink);
    margin-bottom: 0.15rem;
  }
  .term-list .name::before { content: "> "; color: var(--green); }
  .term-list a.endpoint {
    color: var(--green);
    text-decoration: none;
    word-break: break-all;
    font-size: 0.7rem;
  }
  .term-list a.endpoint:hover { color: var(--ink); }
  .term-list .meta {
    margin: 0.2rem 0 0;
    color: var(--muted);
    font-size: 0.62rem;
  }
  .term-list .meta a { color: var(--muted); }
  .term-list .meta a:hover { color: var(--green); }
  .term-edge {
    display: none;
    appearance: none;
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 0.65rem 0.3rem;
    border: 1px solid var(--green-dim);
    border-left: 0;
    border-radius: 0 2px 2px 0;
    background: rgba(0, 8, 4, 0.92);
    color: var(--green);
    font: inherit;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .term-edge:hover { background: rgba(45, 255, 106, 0.12); color: var(--ink); }

  .loader {
    position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: .6rem;
    background: #000; transition: opacity .4s ease, visibility .4s ease;
  }
  .loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader p { margin: 0; color: var(--green); letter-spacing: .16em; font-size: .9rem; text-align: center; }
  .loader .sub { color: var(--muted); font-size: .75rem; }
  .bar { width: min(16rem, 70vw); height: 2px; background: rgba(45,255,106,.15); }
  .bar > span { display: block; height: 100%; width: 0%; background: var(--green); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (max-width: 640px) {
    .hud-tr, .hud-br, .reticle { display: none; }
    .brand-hud h1 { font-size: clamp(2.2rem, 12vw, 3.2rem); letter-spacing: 0.1em; }
    .credit { font-size: 0.58rem; letter-spacing: 0.08em; bottom: 0.65rem; }
    .term {
      left: 0.55rem;
      bottom: 2.1rem;
      width: min(18.5rem, calc(100vw - 1.1rem));
      max-height: 36vh;
    }
  }

  /* Minimized: dock as edge tab (after media so width:0 wins) */
  .term.is-min {
    width: 0;
    max-height: none;
    border-color: transparent;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    overflow: visible;
  }
  .term.is-min .term-edge { display: block; }
  .term.is-min .term-body,
  .term.is-min .term-head { display: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="scanline" aria-hidden="true"></div>

<div class="corner tl" aria-hidden="true"></div>
<div class="corner tr" aria-hidden="true"></div>
<div class="corner bl" aria-hidden="true"></div>
<div class="corner br" aria-hidden="true"></div>
<div class="reticle" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div class="loader" id="loader" role="status">
  <p id="loaderMsg">LOADING_</p>
  <div class="bar"><span id="loadBar"></span></div>
  <p class="sub" id="loaderSub"></p>
</div>

<header class="hud brand-hud">
  <p class="jp">COMPUTER SCIENCE · MATHEMATICS</p>
  <h1>ASIF BHUIYAN</h1>
  <span class="rule" aria-hidden="true"></span>
  <nav class="links">
    <a href="https://github.com/asbou45115" target="_blank" rel="noopener noreferrer">github</a>
    <a href="https://www.linkedin.com/in/asif-bhuiyan-832751279/" target="_blank" rel="noopener noreferrer">linkedin</a>
  </nav>
</header>

<aside class="hud hud-tr" aria-hidden="true">
  <div><span class="live">LINK</span> STABLE</div>
  <div>SEC.LAYER // OPEN</div>
  <div id="hudCoords">X 0.00 · Y 0.00</div>
</aside>

<aside class="hud hud-br" aria-hidden="true">
  <div>OPTIC_FEED // ACTIVE</div>
  <div id="hudFrame">FRAME —— / ——</div>
  <div class="cache" id="hudCache">CACHE 0%</div>
</aside>

<p class="credit">
  ascii by
  <a href="https://github.com/asbou45115/ascii_renderer" target="_blank" rel="noopener noreferrer">ascii_renderer</a>
</p>

<section class="term is-min" id="term" aria-label="Projects terminal">
  <div class="term-head">
    <span class="title">PROJECTS</span>
    <button type="button" id="termRefresh" title="Refresh">SYNC</button>
    <button type="button" id="termToggle" class="term-close" title="Close" aria-label="Close">×</button>
  </div>
  <div class="term-body">
    <p class="term-status" id="termStatus">querying github…</p>
    <ul class="term-list" id="termList"></ul>
    <p class="term-more">
      <a href="https://github.com/asbou45115?tab=repositories" target="_blank" rel="noopener noreferrer">github // all projects →</a>
    </p>
  </div>
  <button type="button" class="term-edge" id="termEdge" aria-label="Open projects">PROJECTS</button>
</section>

<script type="module">
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d", { alpha: false });
const loader = document.getElementById("loader");
const loaderMsg = document.getElementById("loaderMsg");
const loaderSub = document.getElementById("loaderSub");
const loadBar = document.getElementById("loadBar");
const hudCoords = document.getElementById("hudCoords");
const hudFrame = document.getElementById("hudFrame");
const hudCache = document.getElementById("hudCache");

/** @type {(ImageBitmap|null)[]} */
let frames = [];
let frameCount = 0;
let framesReady = 0;
let bootstrapped = false;
let fps = 30;
/** Continuous scrub position in [0, lastIndex] — 0 = start of clip, last = end (held) */
let scrub = 0;
let lastTs = 0;

// Pointer state
let cursorDist = 1;       // 0 = center, 1 = far edge
let pointerX = 0;
let pointerY = 0;
let lastPointerTs = 0;
let velocity = 0;         // px/s, smoothed
let targetProgress = 0;   // 0 = last frame (idle), 1 = first frame (full reverse)

/**
 * Concentric rings from outside → center.
 * Each ring unlocks more of the reverse animation (progress toward frame 0).
 * Outer rest zone stays on the last frame; innermost ring completes to frame 0.
 */
/**
 * Concentric rings spanning the full viewport.
 * Dist is normalized so corners = 1 and center = 0 — every on-page position maps to a ring.
 * Outer edge → last frame; center → first frame (full reverse).
 */
const RINGS = [
  { maxDist: 1.00, progress: 0.00 },
  { maxDist: 0.80, progress: 0.18 },
  { maxDist: 0.60, progress: 0.36 },
  { maxDist: 0.40, progress: 0.55 },
  { maxDist: 0.22, progress: 0.75 },
  { maxDist: 0.08, progress: 0.90 },
  { maxDist: 0.00, progress: 1.00 },
];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(innerWidth * dpr));
  const h = Math.max(1, Math.floor(innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    if (bootstrapped && frameCount) {
      const i = nearestLoaded(Math.round(scrub));
      if (i >= 0) paint(frames[i]);
    }
  }
}
window.addEventListener("resize", resize);
resize();

function paint(bmp) {
  if (!bmp) return;
  const cw = canvas.width;
  const ch = canvas.height;
  // Cover the viewport (crop edges) instead of letterboxing
  const scale = Math.max(cw / bmp.width, ch / bmp.height);
  const dw = bmp.width * scale;
  const dh = bmp.height * scale;
  const ox = (cw - dw) / 2;
  const oy = (ch - dh) / 2;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cw, ch);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.filter = "brightness(1.55) contrast(1.25) saturate(1.35)";
  ctx.drawImage(bmp, ox, oy, dw, dh);
  // Soft green lift pass so the ASCII greens read brighter on black
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = 0.12;
  ctx.filter = "none";
  ctx.fillStyle = "#0a3a18";
  ctx.fillRect(0, 0, cw, ch);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

/** Map distance-from-center → reverse progress via ring bands (with smooth blend between rings). */
function progressFromDistance(dist) {
  // Walk rings from outside in; interpolate between neighboring band edges
  let outer = { maxDist: 1.001, progress: 0 };
  for (const ring of RINGS) {
    if (dist >= ring.maxDist) {
      const span = outer.maxDist - ring.maxDist;
      const t = span > 1e-6 ? (outer.maxDist - dist) / span : 1;
      return outer.progress + (ring.progress - outer.progress) * Math.min(1, Math.max(0, t));
    }
    outer = ring;
  }
  return 1;
}

function setPointer(clientX, clientY, timeStamp) {
  // -1..1 from center, then normalize so page corners = 1
  const nx = (clientX / innerWidth) * 2 - 1;
  const ny = (clientY / innerHeight) * 2 - 1;
  cursorDist = Math.min(1, Math.hypot(nx, ny) / Math.SQRT2);

  const ts = timeStamp || performance.now();
  if (lastPointerTs > 0) {
    const dt = Math.max(0.001, (ts - lastPointerTs) / 1000);
    const dx = clientX - pointerX;
    const dy = clientY - pointerY;
    const instant = Math.hypot(dx, dy) / dt;
    velocity = velocity * 0.72 + instant * 0.28;
  }
  pointerX = clientX;
  pointerY = clientY;
  lastPointerTs = ts;

  targetProgress = progressFromDistance(cursorDist);
  if (hudCoords) {
    hudCoords.textContent =
      `X ${((clientX / innerWidth) * 100).toFixed(1)} · Y ${((clientY / innerHeight) * 100).toFixed(1)}`;
  }
}

window.addEventListener("pointermove", (e) => setPointer(e.clientX, e.clientY, e.timeStamp));
window.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  if (t) setPointer(t.clientX, t.clientY, e.timeStamp);
}, { passive: true });
window.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  if (t) setPointer(t.clientX, t.clientY, e.timeStamp);
}, { passive: true });

/** Decay velocity when the pointer stops moving. */
setInterval(() => {
  if (performance.now() - lastPointerTs > 80) {
    velocity *= 0.85;
  }
}, 50);

/**
 * Scrub toward the ring target.
 * progress 0 → last frame, progress 1 → first frame.
 * Mouse speed scales how quickly scrub catches the target.
 */
/**
 * Scrub toward the ring target.
 * progress 0 → last frame, progress 1 → first frame.
 * Uses nearest loaded frame while the cache is still filling.
 */
function nearestLoaded(i) {
  if (!frameCount) return -1;
  if (frames[i]) return i;
  for (let d = 1; d < frameCount; d++) {
    if (i + d < frameCount && frames[i + d]) return i + d;
    if (i - d >= 0 && frames[i - d]) return i - d;
  }
  return -1;
}

function tick(ts) {
  requestAnimationFrame(tick);
  if (!bootstrapped || !frameCount) return;

  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;

  const last = frameCount - 1;
  const targetIndex = last * (1 - targetProgress);

  const speedBoost = Math.min(4.5, velocity / 700);
  const rate = (5.5 + speedBoost * 10) * dt;

  scrub += (targetIndex - scrub) * Math.min(1, rate);
  if (Math.abs(targetIndex - scrub) < 0.02) scrub = targetIndex;

  const want = Math.round(Math.min(last, Math.max(0, scrub)));
  const frameIndex = nearestLoaded(want);
  if (frameIndex < 0) return;

  paint(frames[frameIndex]);
  if (hudFrame) {
    hudFrame.textContent =
      `FRAME ${String(frameIndex + 1).padStart(3, "0")} / ${String(frameCount).padStart(3, "0")}`;
  }
}
requestAnimationFrame(tick);

async function loadOne(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("failed " + url);
  const blob = await res.blob();
  return createImageBitmap(blob);
}

function updateCacheHud() {
  if (!hudCache || !frameCount) return;
  const pct = Math.round((framesReady / frameCount) * 100);
  if (framesReady >= frameCount) {
    hudCache.textContent = "CACHE OK";
    hudCache.classList.add("is-done");
  } else {
    hudCache.textContent = `CACHE ${pct}%`;
    hudCache.classList.remove("is-done");
  }
  loadBar.style.width = pct + "%";
  loaderSub.textContent = `${framesReady} / ${frameCount}`;
}

async function loadFrames() {
  const res = await fetch("assets/ascii/manifest.json", { cache: "force-cache" });
  if (!res.ok) {
    throw new Error("manifest missing — run: cd tools/precompute_ascii && uv sync && uv run python main.py");
  }
  const manifest = await res.json();
  fps = manifest.fps || 30;
  const list = manifest.frames || [];
  frameCount = list.length;
  frames = new Array(frameCount).fill(null);
  framesReady = 0;

  if (!frameCount) throw new Error("manifest has no frames");

  // 1) Critical path: last frame (+ a few neighbors for end-state idle feel)
  const last = frameCount - 1;
  const critical = [];
  for (let i = 0; i < Math.min(8, frameCount); i++) critical.push(last - i);

  await Promise.all(critical.map(async (i) => {
    if (frames[i]) return;
    frames[i] = await loadOne(list[i]);
    framesReady += 1;
    updateCacheHud();
  }));

  scrub = last;
  targetProgress = 0;
  paint(frames[last]);
  bootstrapped = true;
  loader.classList.add("is-done");

  // 2) Background: fill remaining frames from end → start (matches scrub usage)
  const remaining = [];
  for (let i = last; i >= 0; i--) {
    if (!frames[i]) remaining.push(i);
  }

  const concurrency = 4;
  let cursor = 0;
  async function worker() {
    while (cursor < remaining.length) {
      const i = remaining[cursor++];
      try {
        frames[i] = await loadOne(list[i]);
        framesReady += 1;
        updateCacheHud();
      } catch (err) {
        console.warn("frame load failed", list[i], err);
      }
    }
  }
  await Promise.all(Array.from({ length: concurrency }, () => worker()));
  updateCacheHud();
}

loadFrames().catch((err) => {
  console.error(err);
  loaderMsg.textContent = "ASCII_FRAMES_MISSING";
  loaderSub.textContent = String(err.message || err);
});

/* ---- TERM_01: published GitHub Pages endpoints ---- */
const GITHUB_USER = "asbou45115";
const term = document.getElementById("term");
const termList = document.getElementById("termList");
const termStatus = document.getElementById("termStatus");
const termToggle = document.getElementById("termToggle");
const termEdge = document.getElementById("termEdge");
const termRefresh = document.getElementById("termRefresh");
const TERM_KEY = "term-endpoints-min";

function setTermMin(min) {
  term.classList.toggle("is-min", min);
  term.setAttribute("aria-expanded", min ? "false" : "true");
  try { localStorage.setItem(TERM_KEY, min ? "1" : "0"); } catch (_) {}
}

function formatDate(dateString) {
  return new Date(dateString).toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
  });
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function pagesUrl(repoName) {
  if (repoName.toLowerCase() === `${GITHUB_USER}.github.io`) {
    return `https://${GITHUB_USER}.github.io/`;
  }
  return `https://${GITHUB_USER}.github.io/${repoName}/`;
}

async function fetchAllPublicRepos() {
  const all = [];
  let page = 1;
  while (true) {
    const response = await fetch(
      `https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated&page=${page}`
    );
    if (!response.ok) throw new Error(`GitHub API error (${response.status})`);
    const repos = await response.json();
    all.push(...repos);
    if (repos.length < 100) break;
    page += 1;
  }
  return all;
}

function renderTermEndpoints(repos) {
  termList.innerHTML = "";
  if (!repos.length) {
    termList.innerHTML = `<li class="meta">No public Pages endpoints found.</li>`;
    return;
  }
  for (const repo of repos) {
    // Skip the user site itself — this page is already it
    if (repo.name.toLowerCase() === `${GITHUB_USER}.github.io`) continue;
    const url = pagesUrl(repo.name);
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="name">${escapeHtml(repo.name)}</span>
      <a class="endpoint" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>
      <p class="meta">upd ${escapeHtml(formatDate(repo.updated_at))} · <a href="${escapeHtml(repo.html_url)}" target="_blank" rel="noopener noreferrer">repo</a></p>
    `;
    termList.appendChild(li);
  }
  if (!termList.children.length) {
    termList.innerHTML = `<li class="meta">No project Pages endpoints yet.</li>`;
  }
}

async function loadTermEndpoints() {
  termStatus.textContent = "querying github…";
  termRefresh.disabled = true;
  try {
    const repos = await fetchAllPublicRepos();
    const pages = repos
      .filter((r) => !r.fork && r.has_pages)
      .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
    renderTermEndpoints(pages);
    const shown = [...termList.querySelectorAll("li .name")].length;
    termStatus.textContent = `ok · ${shown} endpoint${shown === 1 ? "" : "s"}`;
  } catch (err) {
    termList.innerHTML = "";
    termStatus.textContent = String(err.message || err);
  } finally {
    termRefresh.disabled = false;
  }
}

// Default minimized on narrow screens; restore preference otherwise
(() => {
  let min = true;
  try {
    const saved = localStorage.getItem(TERM_KEY);
    if (saved === "0" || saved === "1") min = saved === "1";
    else min = window.matchMedia("(max-width: 640px)").matches;
  } catch (_) {
    min = window.matchMedia("(max-width: 640px)").matches;
  }
  setTermMin(min);
})();

termToggle.addEventListener("click", (e) => {
  e.stopPropagation();
  setTermMin(!term.classList.contains("is-min"));
});
termEdge.addEventListener("click", (e) => {
  e.stopPropagation();
  setTermMin(false);
});
termRefresh.addEventListener("click", (e) => {
  e.stopPropagation();
  loadTermEndpoints();
});

// Keep canvas scrub from treating terminal drags as page interaction noise — stop bubble on panel
term.addEventListener("pointerdown", (e) => e.stopPropagation());

loadTermEndpoints();
</script>
